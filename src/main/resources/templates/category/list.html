<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Thể loại · Thư viện</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<header th:replace="~{layout/header :: header}"></header>
<main class="container">
    <div class="page-heading"><div><h1>Thể loại sách</h1><p>Quản lý các nhóm sách trong thư viện.</p></div><a class="button" th:href="@{/categories/new}">Thêm thể loại</a></div>
    <p class="notice success" th:if="${success}" th:text="${success}"></p>
    <form class="filters" th:action="@{/categories}" method="get"><input name="q" placeholder="Tìm tên thể loại" th:value="${q}"><button class="button secondary">Tìm</button></form>
    <div class="table-wrap"><table><thead><tr><th>Tên</th><th>Mô tả</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody>
    <tr th:each="category : ${categories.content}"><td th:text="${category.name}"></td><td th:text="${category.description}"></td><td><span class="badge" th:text="${category.active ? 'Đang dùng' : 'Đã ẩn'}"></span></td>
        <td class="actions"><a th:href="@{/categories/{id}/edit(id=${category.id})}">Sửa</a><form th:if="${category.active}" th:action="@{/categories/{id}/deactivate(id=${category.id})}" method="post"><button class="link danger" onclick="return confirm('Ngừng hoạt động thể loại này?')">Ngừng</button></form></td></tr>
    <tr th:if="${categories.empty}"><td colspan="4" class="empty">Chưa có thể loại phù hợp.</td></tr></tbody></table></div>
    <div th:replace="~{layout/pagination :: pages(${categories})}"></div>
</main>
<footer th:replace="~{layout/footer :: footer}"></footer>
</body></html>
