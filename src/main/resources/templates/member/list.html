<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Thành viên · Thư viện</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<header th:replace="~{layout/header :: header}"></header>
<main class="container">
    <div class="page-heading"><div><h1>Thành viên</h1><p>Quản lý hồ sơ và trạng thái mượn sách.</p></div><a class="button" th:href="@{/members/new}">Thêm thành viên</a></div>
    <p class="notice success" th:if="${success}" th:text="${success}"></p>
    <form class="filters" th:action="@{/members}" method="get"><input name="q" placeholder="Tên hoặc email" th:value="${q}"><select name="status"><option value="">Tất cả trạng thái</option><option value="ACTIVE" th:selected="${status == 'ACTIVE'}">Đang hoạt động</option><option value="BLOCKED" th:selected="${status == 'BLOCKED'}">Đã khóa</option></select><button class="button secondary">Lọc</button></form>
    <div class="table-wrap"><table><thead><tr><th>Họ tên</th><th>Email</th><th>Điện thoại</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody>
    <tr th:each="member : ${members.content}"><td th:text="${member.fullName}"></td><td th:text="${member.email}"></td><td th:text="${member.phone}"></td><td><span class="badge" th:text="${member.status}"></span></td><td class="actions"><a th:href="@{/members/{id}/edit(id=${member.id})}">Sửa</a><form th:action="@{/members/{id}/status(id=${member.id})}" method="post"><input type="hidden" name="blocked" th:value="${member.status == 'ACTIVE'}"><button class="link" th:text="${member.status == 'ACTIVE' ? 'Khóa' : 'Mở khóa'}"></button></form></td></tr>
    <tr th:if="${members.empty}"><td colspan="5" class="empty">Không tìm thấy thành viên.</td></tr></tbody></table></div>
    <div th:replace="~{layout/pagination :: pages(${members})}"></div>
</main><footer th:replace="~{layout/footer :: footer}"></footer>
</body></html>
