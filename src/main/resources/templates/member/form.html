<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${pageTitle}">Thành viên</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<header th:replace="~{layout/header :: header}"></header>
<main class="container narrow"><h1 th:text="${pageTitle}"></h1>
    <form class="card form" th:action="${action}" th:object="${form}" method="post">
        <label>Họ và tên<input th:field="*{fullName}" required maxlength="150"><small class="field-error" th:errors="*{fullName}"></small></label>
        <label>Email<input type="email" th:field="*{email}" required maxlength="100"><small class="field-error" th:errors="*{email}"></small></label>
        <label>Số điện thoại<input th:field="*{phone}" maxlength="20"><small class="field-error" th:errors="*{phone}"></small></label>
        <div class="form-actions"><a class="button secondary" th:href="@{/members}">Hủy</a><button class="button">Lưu</button></div>
    </form>
</main><footer th:replace="~{layout/footer :: footer}"></footer>
</body></html>
