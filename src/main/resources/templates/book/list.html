<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sách · Thư viện</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<header th:replace="~{layout/header :: header}"></header>
<main class="container">
    <div class="page-heading"><div><h1>Danh sách sách</h1><p>Tìm kiếm và quản lý đầu sách, số lượng còn lại.</p></div><a class="button" th:href="@{/books/new}">Thêm sách</a></div>
    <p class="notice success" th:if="${success}" th:text="${success}"></p>
    <form class="filters" th:action="@{/books}" method="get"><input name="q" placeholder="Tên sách, tác giả hoặc ISBN" th:value="${q}">
        <select name="categoryId"><option value="">Tất cả thể loại</option><option th:each="category : ${categories.content}" th:value="${category.id}" th:text="${category.name}" th:selected="${category.id == categoryId}"></option></select><button class="button secondary">Tìm</button></form>
    <div class="table-wrap"><table><thead><tr><th>ISBN</th><th>Tên sách</th><th>Tác giả</th><th>Thể loại</th><th>Còn / Tổng</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody>
    <tr th:each="book : ${books.content}"><td th:text="${book.isbn}"></td><td th:text="${book.title}"></td><td th:text="${book.author}"></td><td th:text="${book.categoryName}"></td><td th:text="|${book.availableQuantity} / ${book.totalQuantity}|"></td><td><span class="badge" th:text="${book.status}"></span></td>
        <td class="actions"><a th:href="@{/books/{id}/edit(id=${book.id})}">Sửa</a><form th:action="@{/books/{id}/deactivate(id=${book.id})}" method="post"><button class="link danger" onclick="return confirm('Ẩn đầu sách này?')">Ẩn</button></form></td></tr>
    <tr th:if="${books.empty}"><td colspan="7" class="empty">Không tìm thấy sách.</td></tr></tbody></table></div>
    <div th:replace="~{layout/pagination :: pages(${books})}"></div>
</main><footer th:replace="~{layout/footer :: footer}"></footer>
</body></html>
