<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sách quá hạn · Thư viện</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<header th:replace="~{layout/header :: header}"></header>
<main class="container"><div class="page-heading"><div><h1>Phiếu mượn quá hạn</h1><p>Các phiếu còn sách chưa trả sau ngày đến hạn.</p></div></div>
    <nav class="report-links"><a th:href="@{/reports/overdue}">Quá hạn</a><a th:href="@{/reports/popular-books}">Sách được mượn nhiều</a><a th:href="@{/reports/members}">Lượt mượn theo thành viên</a></nav>
    <div class="table-wrap"><table><thead><tr><th>Mã phiếu</th><th>Thành viên</th><th>Email</th><th>Ngày mượn</th><th>Hạn trả</th><th>Số ngày trễ</th></tr></thead><tbody>
    <tr th:each="item : ${items}"><td><a th:href="@{/borrowings/{id}(id=${item.borrowingId})}" th:text="|#${item.borrowingId}|"></a></td><td th:text="${item.memberName}"></td><td th:text="${item.memberEmail}"></td><td th:text="${item.borrowDate}"></td><td th:text="${item.dueDate}"></td><td th:text="${item.daysOverdue}"></td></tr>
    <tr th:if="${#lists.isEmpty(items)}"><td colspan="6" class="empty">Không có phiếu quá hạn.</td></tr></tbody></table></div>
</main><footer th:replace="~{layout/footer :: footer}"></footer>
</body></html>
